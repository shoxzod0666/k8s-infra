apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zabbix-secret
  namespace: zabbix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-cluster
    kind: ClusterSecretStore
  target:
    name: zabbix-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: zabbix/admin
        property: postgres_password
