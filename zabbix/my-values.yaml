zabbixServer:
  enabled: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "300m"

zabbixWeb:
  enabled: true

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: zabbix.173.249.57.192.sslip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zabbix-tls
      hosts:
        - zabbix.173.249.57.192.sslip.io

zabbixAgent:
  enabled: true

postgresql:
  enabled: true
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
