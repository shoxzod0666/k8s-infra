server:
  dev:
    enabled: true

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: vault.173.249.57.192.sslip.io
    tls:
      - secretName: vault-tls
        hosts:
          - vault.173.249.57.192.sslip.io

ui:
  enabled: true
