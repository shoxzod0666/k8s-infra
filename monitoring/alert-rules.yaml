apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: node-alerts
      rules:
        - alert: HighCPUUsage
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Yuqori CPU sarfi ({{ $labels.instance }})"
            description: "CPU sarfi 80% dan oshdi: {{ $value | printf \"%.2f\" }}%"

        - alert: HighMemoryUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Yuqori RAM sarfi ({{ $labels.instance }})"
            description: "RAM sarfi 85% dan oshdi: {{ $value | printf \"%.2f\" }}%"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod qayta-qayta o'chib-yonyapti ({{ $labels.namespace }}/{{ $labels.pod }})"
            description: "Pod {{ $labels.pod }} restart bo'lyapti"

        - alert: PodNotReady
          expr: kube_pod_status_phase{phase=~"Pending|Unknown"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod tayyor emas ({{ $labels.namespace }}/{{ $labels.pod }})"
            description: "Pod {{ $labels.pod }} {{ $labels.phase }} holatda"
